name: taskly-nnct-corp-guidance
services:
  api:
    image: ghcr.io/asari194617/taskly-nnct-corp-guidance:${IMAGE_TAG:?set IMAGE_TAG to an immutable commit SHA}
    env_file:
      - path: .env.production
        format: raw
    environment:
      ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:3071:8080"
    networks:
      - taskly
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
networks:
  taskly:
    external: true
    name: infra_default

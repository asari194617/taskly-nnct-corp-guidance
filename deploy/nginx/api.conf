# Install only after provisioning a certificate for this exact hostname.
# Keep the existing virtual hosts intact; nginx -t must pass before reload.
# This file is included from nginx's http context. Empty keys exempt other
# routes; $binary_remote_addr is the peer IP observed by nginx, not a client
# supplied forwarding header.
map $uri $guidance_login_source {
    default "";
    /auth/start $binary_remote_addr;
}
map $uri $guidance_login_all {
    default "";
    /auth/start $server_name;
}
limit_req_zone $guidance_login_source zone=guidance_login_ip:1m rate=30r/m;
limit_req_zone $guidance_login_all zone=guidance_login_all:1m rate=300r/m;
server {
    listen 443 ssl;
    server_name api.nnct-corp-guidance-2026.taskly.iy0306.com;
    ssl_certificate /etc/letsencrypt/live/api.nnct-corp-guidance-2026.taskly.iy0306.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nnct-corp-guidance-2026.taskly.iy0306.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 16k;
    # OAuth codes/state are query parameters. Do not retain them in access logs.
    access_log off;
    limit_req zone=guidance_login_ip burst=14 nodelay;
    limit_req zone=guidance_login_all burst=59 nodelay;
    limit_req_status 429;
    error_page 429 = @guidance_login_limited;
    location @guidance_login_limited {
        add_header Retry-After "2" always;
        return 429;
    }
    location / {
        proxy_pass http://127.0.0.1:3071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    server_name api.nnct-corp-guidance-2026.taskly.iy0306.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

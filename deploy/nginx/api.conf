# Install only after provisioning a certificate for this exact hostname.
# Keep the existing virtual hosts intact; nginx -t must pass before reload.
server {
    listen 443 ssl;
    server_name api.nnct-corp-guidance-2026.taskly.iy0306.com;
    ssl_certificate /etc/letsencrypt/live/api.nnct-corp-guidance-2026.taskly.iy0306.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nnct-corp-guidance-2026.taskly.iy0306.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 16k;
    # OAuth codes/state are query parameters. Do not retain them in access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    server_name api.nnct-corp-guidance-2026.taskly.iy0306.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

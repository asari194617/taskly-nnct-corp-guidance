target-version = "py312"
line-length = 88
respect-gitignore = true
force-exclude = true
extend-exclude = ["data", "private", ".e2e", "node_modules", "out", "coverage", "test-results", "playwright-report"]

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

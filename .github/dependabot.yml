version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /deploy/r2
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: mysql
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 * * *'
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

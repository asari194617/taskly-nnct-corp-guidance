name: PR coverage report
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This privileged workflow never checks out or executes the PR's code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: coverage-*
          merge-multiple: true
          path: reports
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const read = name => {
              const file = `reports/${name}.json`;
              if (fs.statSync(file).size > 4096) throw new Error('Oversized report');
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            };
            let metadata;
            try { metadata = read('pr'); } catch { core.warning('PR metadata unavailable'); return; }
            if (!Number.isSafeInteger(metadata.number) || metadata.number < 1 ||
                !/^[0-9a-f]{40}$/.test(metadata.sha) || typeof metadata.repository !== 'string') return;
            if (run.head_repository?.full_name !== metadata.repository ||
                (run.pull_requests.length && !run.pull_requests.some(p => p.number === metadata.number))) return;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: metadata.number});
            if (pr.state !== 'open' || pr.head.sha !== metadata.sha ||
                pr.head.repo?.full_name !== metadata.repository || pr.head.ref !== run.head_branch) return;
            const rows = [
              ['API とコマンド（Go ステートメント）', 'api'],
              ['インポーター（Go ステートメント）', 'importer'],
              ['Web（行カバレッジ）', 'web'],
              ['Service Worker の単体実行（行カバレッジ）', 'offline-worker'],
              ['PDF 抽出（Python ステートメント）', 'extractor'],
              ['Chromium E2E（行カバレッジ）', 'e2e'],
              ['実 MySQL 統合テスト（Go ステートメント）', 'integration'],
              ['MCP API テスト（Go ステートメント）', 'mcp-api'],
              ['MCP 実 MySQL テスト（Go ステートメント）', 'mcp-integration'],
            ].map(([name,id]) => {
              let value = '計測結果なし（テストまたはセットアップに失敗）';
              try {
                const {percent,covered,total} = read(id);
                if (typeof percent !== 'number' || !Number.isFinite(percent) || percent < 0 || percent > 100) throw Error('Invalid percentage');
                const component = id === 'mcp-api' || id === 'mcp-integration';
                if (component && (!Number.isSafeInteger(covered) || !Number.isSafeInteger(total) || covered < 0 || total < 1 || covered > total || total > 10000000 || Math.abs(percent - 100 * covered / total) > 1e-8)) throw Error('Invalid MCP statement counts');
                value = `${percent.toFixed(1)}% ${id === 'e2e' ? '' : percent >= 80 ? '✅' : '❌'}`;
                if (component) value += `（全 ${total} 文のうち ${covered} 文）`;
              } catch { value = '計測結果なし（テストまたはセットアップに失敗）'; }
              return `| ${name} | ${value} | ${id === 'e2e' ? '計測のみ' : '80%'} |`;
            });
            let functional = '結果なし（テストまたはセットアップに失敗）';
            try {
              const {passed,total} = read('mcp-functional');
              if (Number.isSafeInteger(passed) && total === 18 && passed >= 0 && passed <= total)
                functional = `${total} 件中 ${passed} 件成功 ${passed === total ? '✅' : '❌'}`;
            } catch {}
            rows.push(`| MCP HTTP・公式 SDK（機能テスト） | ${functional} | 全 18 件成功 |`);
            const marker = '<!-- nnct-guidance-coverage -->';
            const body = [marker, '### テストカバレッジ', '', '| テストグループ | カバレッジ・結果 | 必須基準 |',
              '| --- | ---: | ---: |', ...rows, '', `コミット ${metadata.sha.slice(0,7)} の計測結果です。`,
              '表の 80% は各グループの最低基準です。API と実 MySQL 統合テストはそれぞれの全対象コードを計測します。MCP HTTP の機能テストは成功件数、Chromium E2E はページの行カバレッジを表示します。Service Worker は実際のコードを Node で実行して計測します。',
              `[CI の実行結果](${run.html_url})`].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner,repo,issue_number:metadata.number,per_page:100});
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number:metadata.number,body});
            await core.summary.addRaw(body).write();

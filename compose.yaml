name: taskly-nnct-corp-guidance-dev
services:
  db:
    image: mysql:9.7.4
    environment:
      MYSQL_DATABASE: guidance
      MYSQL_USER: guidance
      MYSQL_PASSWORD: development-only
      MYSQL_ROOT_PASSWORD: development-root-only
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  db:
